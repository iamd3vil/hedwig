[package]
name = "hedwig"
version = "0.13.0"
edition = "2021"

[dependencies]
smtp = { path = "../smtp" }
miette = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
mail-parser = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
camino = "1.2.6"
ulid = "3.0.0"
config = { version = "0.15.27", default-features = false, features = [
    "async",
    "toml",
    "json",
] }
huml-rs = "0.3.0"
async-channel = "2.5.0"
futures = "0.3.34"
async-stream = "0.3.6"
email-address-parser = "2.0.2"
hickory-resolver = "0.26.3"
hostname = "0.4.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
tokio-rustls = { version = "0.26.6", features = [
    "ring",
], default-features = false }
subtle = "2.6.1"
# For CRAM-MD5 verification; both already in the tree as transitive deps.
hmac = "0.13.0"
md-5 = "0.11.0"
tempfile = "3.27.0"
pkcs8 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-serde = "0.2.0"
lettre = { version = "0.11.24", features = [
    "smtp-transport",
    "pool",
    "rustls",
    "ring",
    "webpki-roots",
    "tokio1",
    "tokio1-rustls",
    "builder",
    "hostname",
], default-features = false }
mail-auth = "0.15.1"
rustls-pki-types = "1.16.0"
moka = { version = "0.12.16", features = ["future"] }
tokio-util = { version = "0.7.20", features = ["io"] }
rustls = { version = "0.23.46", features = ["ring"], default-features = false }
webpki-roots = "1.0.12"
clap = { version = "4.6.9", features = ["derive"] }
base64 = "0.23.1"
rsa = "0.10.0"
rand = "0.10.4"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
pem = "4.0.0"
memchr = "2.8.3"
mailparse = "0.18.0"
humantime-serde = "1.1.1"
chrono = { version = "0.4.45", features = ["serde"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "http2"] }
once_cell = "1.21.4"
prometheus = "0.14.0"
crc32fast = "1.5.5"
lz4_flex = { version = "0.11", default-features = false }
bytes = "1.12.2"
libc = "0.2.191"
arc-swap = "1.9.5"

[dev-dependencies]
stateright = "0.31.0"

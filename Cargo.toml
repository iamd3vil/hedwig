[workspace]
members = ["smtp-server", "smtp"]
exclude = ["smtp-server/fuzz"]
resolver = "2"

[workspace.dependencies]
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "net",
    "io-util",
    "rt-multi-thread",
    "macros",
    "fs",
    "io-std",
    "sync",
    "signal",
] }
async-trait = "0.1.92"
